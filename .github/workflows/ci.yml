name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Setup cachix (optional — set CACHIX_AUTH_TOKEN secret to enable)
        if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix flake metadata
        run: nix flake metadata

      - name: nix flake show
        run: nix flake show --allow-import-from-derivation

      - name: nix flake check
        run: nix flake check --keep-going --show-trace --allow-import-from-derivation

  build-hosts:
    name: build .#${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixosConfigurations.broadway.config.system.build.toplevel
            runner: ubuntu-24.04
          - config: nixosConfigurations.broadway-bootstrap.config.system.build.toplevel
            runner: ubuntu-24.04
          - config: nixosConfigurations.atlas.config.system.build.toplevel
            runner: ubuntu-24.04
          - config: nixosConfigurations.atlas-bootstrap.config.system.build.toplevel
            runner: ubuntu-24.04
          - config: darwinConfigurations.workhorse.config.system.build.toplevel
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: build
        run: |
          nix build --no-link --show-trace ".#${{ matrix.config }}"
